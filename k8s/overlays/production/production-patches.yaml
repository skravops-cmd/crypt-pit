apiVersion: apps/v1
kind: Deployment
metadata:
  name: crypt-pit
spec:
  replicas: 3  # More replicas for production
  template:
    spec:
      containers:
      - name: crypt-pit
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"