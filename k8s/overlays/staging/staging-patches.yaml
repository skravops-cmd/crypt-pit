apiVersion: apps/v1
kind: Deployment
metadata:
  name: crypt-pit
spec:
  replicas: 1  # Single replica for staging
  template:
    spec:
      containers:
      - name: crypt-pit
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"