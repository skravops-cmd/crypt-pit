apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crypt-pit
  labels:
    app: crypt-pit
  annotations:
    # Cloudflare SSL/TLS configuration
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # Cloudflare specific headers
    traefik.ingress.kubernetes.io/router.middlewares: default-cloudflare-headers@kubernetescrd
    # Enable real IP from Cloudflare
    traefik.ingress.kubernetes.io/router.middlewares: default-cloudflare-headers@kubernetescrd,default-real-ip@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - crypt.skravops.xyz
    # No secretName needed - Cloudflare handles SSL
  rules:
  - host: crypt.skravops.xyz
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: crypt-pit
            port:
              number: 80