apiVersion: apps/v1
kind: Deployment
metadata:
  name: crypt-pit
  labels:
    app: crypt-pit
    version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crypt-pit
  template:
    metadata:
      labels:
        app: crypt-pit
        version: "1.0"
    spec:
      containers:
      - name: crypt-pit
        image: ghcr.io/skravops-cmd/crypt-pit:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5