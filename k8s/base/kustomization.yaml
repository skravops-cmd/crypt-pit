apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: crypt-pit-base

resources:
  - deployment.yaml
  - service.yaml
  - ingressroute.yaml

labels:
  - includeSelectors: true
    pairs:
      app: crypt-pit
      managed-by: kustomize

images:
  - name: ghcr.io/skravops-cmd/crypt-pit
    newTag: latest