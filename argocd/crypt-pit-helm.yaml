apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crypt-pit-helm
  namespace: argocd
  labels:
    app: crypt-pit
    deployment-type: helm
spec:
  project: default
  source:
    repoURL: https://github.com/skravops-cmd/crypt-pit
    targetRevision: HEAD
    path: k8s/helm/crypt-pit
    helm:
      valueFiles:
      - values.yaml
      parameters:
      - name: image.tag
        value: $ARGOCD_APP_REVISION
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=false
  revisionHistoryLimit: 10