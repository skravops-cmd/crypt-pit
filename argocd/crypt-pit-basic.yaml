apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crypt-pit-basic
  namespace: argocd
  labels:
    app: crypt-pit
    deployment-type: basic
spec:
  project: default
  source:
    repoURL: https://github.com/skravops-cmd/crypt-pit
    targetRevision: HEAD
    path: k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=false
  revisionHistoryLimit: 10