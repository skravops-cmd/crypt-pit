apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crypt-pit-kustomize
  namespace: argocd
  labels:
    app: crypt-pit
    deployment-type: kustomize
spec:
  project: default
  source:
    repoURL: https://github.com/skravops-cmd/crypt-pit
    targetRevision: HEAD
    path: k8s/overlays/production
    kustomize:
      version: v5.2.1
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
  revisionHistoryLimit: 10